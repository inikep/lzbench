[package]
name = "pulsar"
version = "2.5.0"
edition = "2021"
description = "pulsar 2.5.0 own-only lossless compressor (BW23)"
license = "GPL-3.0-or-later"
authors = ["Corey Tasz <Slid Phi Labs>"]
publish = false

[lib]
name = "pulsar"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "pulsar"
path = "src/bin/pulsar.rs"

[[bin]]
name = "pulsar-bench"
path = "src/bin/pulsar-bench.rs"

[profile.release]
lto = false
codegen-units = 1
