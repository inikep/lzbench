# Publishes doc/results (the interactive results page) to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Results page

on:
  push:
    branches: [master]
    paths: ['doc/results/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/results
      - id: deployment
        uses: actions/deploy-pages@v4
